name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Раз в неделю трогаем кэш TDLib, иначе GitHub удалит его через 7 дней простоя (SPEC 15.6).
    - cron: "17 3 * * 1"

# Тип события в группе: прогон по расписанию не вытесняет ожидающий push-прогон в main.
# Отменяются только устаревшие прогоны PR.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Полный хеш коммита TDLib 1.8.70 (SPEC 15.3). Ключ кэша строится из него.
  TDLIB_COMMIT: ba976cb4aba53a82eff425db2f85e2741774c944
  # Увеличить при любом изменении рецепта сборки TDLib ниже.
  TDLIB_RECIPE: v1
  TDLIB_PREFIX: ${{ github.workspace }}/td/tdlib
  DEPS_DIR: ${{ github.workspace }}/.cache/deps

jobs:
  tdlib:
    name: tdlib (cached)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Restore TDLib
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TDLIB_PREFIX }}
          key: tdlib-${{ env.TDLIB_COMMIT }}-ubuntu-24.04-clang18-${{ env.TDLIB_RECIPE }}
          # По расписанию кэш скачивается целиком: это обновляет время последнего доступа.
          lookup-only: ${{ github.event_name != 'schedule' }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 ninja-build gperf libssl-dev zlib1g-dev

      - name: Add swap
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # TDLib требует 1,5–3 ГБ RAM на поток компиляции (SPEC 15.3).
          sudo fallocate -l 8G /tdlib-swap
          sudo chmod 600 /tdlib-swap
          sudo mkswap /tdlib-swap
          sudo swapon /tdlib-swap
          free -h

      - name: Build TDLib
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          src="$RUNNER_TEMP/td-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/tdlib/td.git "$TDLIB_COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          cmake -S "$src" -B "$RUNNER_TEMP/td-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_LTO=OFF \
            -DBUILD_TESTING=OFF \
            -DTD_INSTALL_SHARED_LIBRARIES=OFF \
            -DCMAKE_INSTALL_PREFIX:PATH="$TDLIB_PREFIX"
          cmake --build "$RUNNER_TEMP/td-build" --target install -j2

      - name: Save TDLib
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TDLIB_PREFIX }}
          key: tdlib-${{ env.TDLIB_COMMIT }}-ubuntu-24.04-clang18-${{ env.TDLIB_RECIPE }}

  build:
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    needs: tdlib
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: dev, compiler: gcc-13, cc: gcc-13, cxx: g++-13 }
          - { preset: dev, compiler: clang-18, cc: clang-18, cxx: clang++-18 }
          - { preset: ci, compiler: gcc-13, cc: gcc-13, cxx: g++-13 }
          - { preset: ci, compiler: clang-18, cc: clang-18, cxx: clang++-18 }
          - { preset: asan, compiler: clang-18, cc: clang-18, cxx: clang++-18 }
          - { preset: tsan, compiler: clang-18, cc: clang-18, cxx: clang++-18 }
          - { preset: release, compiler: gcc-13, cc: gcc-13, cxx: g++-13 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CCACHE_KEY: ccache-${{ matrix.preset }}-${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 clang-18 libclang-rt-18-dev ninja-build pkg-config ccache \
            libfuse3-dev libsodium-dev libzstd-dev libssl-dev zlib1g-dev

      - name: Restore TDLib
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TDLIB_PREFIX }}
          key: tdlib-${{ env.TDLIB_COMMIT }}-ubuntu-24.04-clang18-${{ env.TDLIB_RECIPE }}
          fail-on-cache-miss: true

      - name: Restore dependency archives
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-${{ hashFiles('cmake/deps.cmake') }}

      # Кэш ccache пишет только main, PR его только читает (SPEC 15.6).
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ github.sha }}
          restore-keys: ${{ env.CCACHE_KEY }}-

      - name: Allow sanitizer memory layout
        if: matrix.preset == 'asan' || matrix.preset == 'tsan'
        # Новые ядра с mmap_rnd_bits=32 ломают раскладку памяти TSan и ASan.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: ccache statistics
        run: ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}-${{ github.sha }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Отдельная задача без checkout: право удалять кэши не получает код из репозитория.
  ccache-cleanup:
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep only the newest ccache entry per preset and compiler
        # Старые записи иначе вытесняют кэш TDLib из лимита репозитория (SPEC 15.6).
        run: |
          gh cache list --key ccache- --limit 200 --json id,key,createdAt --jq '
            group_by(.key | sub("-[0-9a-f]{40}$"; ""))
            | .[] | sort_by(.createdAt) | .[:-1][] | .id' > stale.txt
          cat stale.txt
          while read -r id; do
            gh cache delete "$id" || true
          done < stale.txt

  format:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check formatting
        run: tools/ci/check-format.sh

  clang-tidy:
    needs: tdlib
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 clang-tidy-18 ninja-build pkg-config libfuse3-dev libsodium-dev \
            libzstd-dev libssl-dev zlib1g-dev

      - name: Restore TDLib
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TDLIB_PREFIX }}
          key: tdlib-${{ env.TDLIB_COMMIT }}-ubuntu-24.04-clang18-${{ env.TDLIB_RECIPE }}
          fail-on-cache-miss: true

      - name: Restore dependency archives
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-${{ hashFiles('cmake/deps.cmake') }}

      - name: Configure
        run: cmake --preset ci

      - name: Select files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=
          fi
          # Заголовки, конфиги clang-tidy и сборки влияют на все файлы: тогда проверяем всё.
          all=1
          if [[ -n "$base" ]]; then
            # Удалённые файлы тоже учитываются: удалённый заголовок влияет на всех, кто его включал.
            git diff -z --name-only "$base" HEAD | tr '\0' '\n' > changed.txt
            if ! grep -qE '\.(h|hpp|h\.in)$|(^|/)CMakeLists\.txt$|\.cmake$|^CMakePresets\.json$|^\.clang-tidy$|^tools/ci/run-clang-tidy\.sh$|^\.github/workflows/ci\.yml$' changed.txt; then
              all=0
            fi
          fi
          if [[ $all -eq 1 ]]; then
            git ls-files -z -- 'src/*.cpp' 'tests/*.cpp' > files.bin
          else
            git diff -z --name-only --diff-filter=d "$base" HEAD -- 'src/*.cpp' 'tests/*.cpp' > files.bin
          fi
          tr '\0' '\n' < files.bin

      - name: Run clang-tidy
        run: |
          if [[ -s files.bin ]]; then
            xargs -0 tools/ci/run-clang-tidy.sh build/ci < files.bin
          else
            echo "no C++ sources changed"
          fi
